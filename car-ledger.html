<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>다차종 스마트 차계부</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--pickle-surface-page, #f8f9fa);
      color: var(--pickle-text-primary, #1a1a1a);
      font-size: 14px;
      line-height: 1.5;
      padding: var(--pickle-inset-screen-x, 16px);
      padding-bottom: 80px;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    /* Header */
    .header {
      margin-bottom: var(--pickle-gap-section, 18px);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-group h1 {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--pickle-text-primary, #111827);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: var(--pickle-surface-fill-soft, #e5e7eb);
      border: 1px solid var(--pickle-border-hairline, #d1d5db);
      color: var(--pickle-text-primary, #1f2937);
      border-radius: var(--pickle-radius-pill, 9999px);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Vehicle Tab Pills */
    .vehicle-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .vehicle-nav::-webkit-scrollbar { display: none; }
    .nav-pill {
      background: var(--pickle-surface-card, #ffffff);
      border: 1px solid var(--pickle-border-control, #cbd5e1);
      color: var(--pickle-text-secondary, #4b5563);
      border-radius: var(--pickle-radius-pill, 9999px);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .nav-pill.active {
      background: var(--pickle-text-primary, #111827);
      color: var(--pickle-text-inverse, #ffffff);
      border-color: var(--pickle-text-primary, #111827);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .nav-pill-add {
      border-style: dashed;
      color: var(--pickle-text-tertiary, #9ca3af);
    }

    /* Dashboard Card */
    .dashboard-card {
      background: var(--pickle-surface-card, #ffffff);
      border: 1px solid var(--pickle-border-hairline, #e5e7eb);
      border-radius: var(--pickle-radius-card, 16px);
      padding: 16px;
      margin-bottom: var(--pickle-gap-section, 18px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .car-profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--pickle-border-hairline, #f3f4f6);
    }
    .car-plate-badge {
      display: inline-block;
      background: var(--pickle-surface-fill-soft, #e5e7eb);
      border: 1px solid var(--pickle-border-control, #d1d5db);
      color: var(--pickle-text-primary, #1f2937);
      font-weight: 700;
      font-size: 13px;
      padding: 2px 8px;
      border-radius: var(--pickle-radius-tile, 6px);
      margin-bottom: 4px;
    }
    .car-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--pickle-text-primary, #111827);
    }
    .car-subtitle {
      font-size: 12px;
      color: var(--pickle-text-secondary, #6b7280);
    }
    .car-spec-btn {
      background: var(--pickle-surface-fill-faint, #f3f4f6);
      border: 1px solid var(--pickle-border-control, #d1d5db);
      border-radius: var(--pickle-radius-tile, 8px);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--pickle-text-primary, #374151);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Health & Status Badges Grid */
    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .health-item {
      background: var(--pickle-surface-fill-faint, #f9fafb);
      border: 1px solid var(--pickle-border-hairline, #e5e7eb);
      border-radius: var(--pickle-radius-tile, 10px);
      padding: 10px;
    }
    .health-label {
      font-size: 11px;
      color: var(--pickle-text-secondary, #6b7280);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .health-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--pickle-text-primary, #111827);
    }
    .health-desc {
      font-size: 11px;
      color: var(--pickle-text-secondary, #9ca3af);
      margin-top: 2px;
    }
    .badge-alert {
      display: inline-block;
      padding: 2px 6px;
      border-radius: var(--pickle-radius-pill, 9999px);
      font-size: 10px;
      font-weight: 700;
      background: #fee2e2;
      color: #dc2626;
    }
    .badge-ok {
      display: inline-block;
      padding: 2px 6px;
      border-radius: var(--pickle-radius-pill, 9999px);
      font-size: 10px;
      font-weight: 700;
      background: #dcfce7;
      color: #16a34a;
    }

    /* Overall Stats Card (when '전체' is selected) */
    .all-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      margin-top: 10px;
    }
    .stat-box {
      background: var(--pickle-surface-fill-faint, #f9fafb);
      border-radius: var(--pickle-radius-tile, 10px);
      padding: 12px 6px;
      border: 1px solid var(--pickle-border-hairline, #e5e7eb);
    }
    .stat-box-num {
      font-size: 15px;
      font-weight: 700;
      color: var(--pickle-text-primary, #111827);
    }
    .stat-box-lbl {
      font-size: 11px;
      color: var(--pickle-text-secondary, #6b7280);
      margin-top: 2px;
    }

    /* Action & Search Bar */
    .action-bar {
      margin-bottom: 14px;
    }
    .add-rec-btn {
      width: 100%;
      background: var(--pickle-text-primary, #111827);
      color: var(--pickle-text-inverse, #ffffff);
      border: none;
      border-radius: var(--pickle-radius-cta, 12px);
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    .add-rec-btn:active {
      transform: scale(0.98);
    }
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-input {
      flex: 1;
      background: var(--pickle-surface-card, #ffffff);
      border: 1px solid var(--pickle-border-control, #d1d5db);
      border-radius: var(--pickle-radius-tile, 8px);
      padding: 8px 12px;
      font-size: 13px;
      color: var(--pickle-text-primary, #111827);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--pickle-text-primary, #111827);
    }
    .sort-select {
      background: var(--pickle-surface-card, #ffffff);
      border: 1px solid var(--pickle-border-control, #d1d5db);
      border-radius: var(--pickle-radius-tile, 8px);
      padding: 8px 8px;
      font-size: 12px;
      color: var(--pickle-text-primary, #111827);
      outline: none;
    }

    /* Category Filter Chips */
    .cat-filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .cat-filter-row::-webkit-scrollbar { display: none; }
    .cat-chip {
      background: var(--pickle-surface-fill-faint, #f3f4f6);
      border: 1px solid var(--pickle-border-hairline, #e5e7eb);
      color: var(--pickle-text-secondary, #4b5563);
      border-radius: var(--pickle-radius-pill, 9999px);
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 500;
    }
    .cat-chip.active {
      background: var(--pickle-surface-fill-soft, #e5e7eb);
      color: var(--pickle-text-primary, #111827);
      border-color: var(--pickle-border-control, #9ca3af);
      font-weight: 700;
    }

    /* Record List */
    .record-count-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--pickle-text-secondary, #6b7280);
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .record-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .record-item {
      background: var(--pickle-surface-card, #ffffff);
      border: 1px solid var(--pickle-border-hairline, #e5e7eb);
      border-radius: var(--pickle-radius-card, 14px);
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rec-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rec-date-car {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--pickle-text-secondary, #6b7280);
    }
    .rec-car-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: var(--pickle-radius-pill, 9999px);
      background: var(--pickle-surface-fill-soft, #e5e7eb);
      color: var(--pickle-text-primary, #374151);
    }
    .rec-cat-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: var(--pickle-radius-tile, 4px);
    }
    .cat-oil { background: #dbeafe; color: #1e40af; }
    .cat-tire { background: #ffedd5; color: #c2410c; }
    .cat-electric { background: #fef9c3; color: #854d0e; }
    .cat-repair { background: #ede9fe; color: #5b21b6; }
    .cat-filter { background: #dcfce7; color: #166534; }
    .cat-insurance { background: #f3e8ff; color: #7e22ce; }
    .cat-fuel { background: #ccfbf1; color: #115e59; }
    .cat-check { background: #e0f2fe; color: #0369a1; }
    .cat-other { background: #f3f4f6; color: #4b5563; }

    .rec-mid {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .rec-desc {
      font-size: 15px;
      font-weight: 600;
      color: var(--pickle-text-primary, #111827);
      flex: 1;
      padding-right: 8px;
    }
    .rec-cost {
      font-size: 16px;
      font-weight: 700;
      color: var(--pickle-text-primary, #111827);
      white-space: nowrap;
    }
    .rec-bot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--pickle-text-secondary, #9ca3af);
      padding-top: 6px;
      border-top: 1px dashed var(--pickle-border-hairline, #f3f4f6);
    }
    .rec-km-shop {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .rec-actions {
      display: flex;
      gap: 6px;
    }
    .btn-text {
      background: none;
      border: none;
      font-size: 11px;
      color: var(--pickle-text-tertiary, #9ca3af);
      cursor: pointer;
      padding: 2px 4px;
    }
    .btn-text:hover {
      color: var(--pickle-text-primary, #111827);
    }
    .btn-text-del:hover {
      color: var(--pickle-accent-danger, #ef4444);
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 0;
    }
    @media (min-width: 500px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }
    .modal-content {
      background: var(--pickle-surface-card, #ffffff);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      animation: slideUp 0.2s ease-out;
    }
    @media (min-width: 500px) {
      .modal-content {
        border-radius: var(--pickle-radius-card, 16px);
      }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--pickle-border-hairline, #f3f4f6);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--pickle-text-secondary, #9ca3af);
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--pickle-text-secondary, #4b5563);
      margin-bottom: 5px;
    }
    .form-control {
      width: 100%;
      background: var(--pickle-surface-fill-faint, #f9fafb);
      border: 1px solid var(--pickle-border-control, #d1d5db);
      border-radius: var(--pickle-radius-tile, 8px);
      padding: 9px 12px;
      font-size: 14px;
      color: var(--pickle-text-primary, #111827);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--pickle-text-primary, #111827);
      background: var(--pickle-surface-card, #ffffff);
    }
    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .quick-tag-chip {
      background: var(--pickle-surface-fill-soft, #e5e7eb);
      border: 1px solid var(--pickle-border-hairline, #d1d5db);
      border-radius: var(--pickle-radius-pill, 9999px);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      color: var(--pickle-text-secondary, #4b5563);
    }
    .modal-submit-btn {
      width: 100%;
      background: var(--pickle-text-primary, #111827);
      color: var(--pickle-text-inverse, #ffffff);
      border: none;
      border-radius: var(--pickle-radius-cta, 10px);
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Authentic Registration Certificate Styles */
    .cert-box {
      border: 2px solid #2b2b2b;
      padding: 12px;
      background: #fafafa;
      color: #111;
      font-size: 12px;
      margin-top: 10px;
    }
    .cert-title-area {
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #2b2b2b;
      padding-bottom: 8px;
    }
    .cert-h1 {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .cert-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .cert-table th, .cert-table td {
      border: 1px solid #777;
      padding: 5px 6px;
      text-align: left;
    }
    .cert-table th {
      background: #f1f3f5;
      font-weight: 600;
      width: 25%;
    }
    .cert-stamp-area {
      text-align: right;
      padding: 8px 10px;
      font-weight: bold;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }
    .cert-stamp {
      display: inline-block;
      border: 2px solid #c92a2a;
      color: #c92a2a;
      padding: 3px 8px;
      font-weight: 900;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--pickle-text-secondary, #9ca3af);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="header">
    <div class="header-top">
      <div class="title-group">
        <h1>🚗 다차종 스마트 차계부</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="exportCSV()">📥 CSV</button>
        <button class="icon-btn" onclick="exportJSON()">💾 백업</button>
      </div>
    </div>

    <!-- Vehicle Selector Pills -->
    <nav class="vehicle-nav" id="vehicleNav">
      <!-- Injected dynamically -->
    </nav>
  </header>

  <!-- Dashboard Overview (Single Car or All) -->
  <section class="dashboard-card" id="dashboardCard">
    <!-- Injected dynamically -->
  </section>

  <!-- Action & Filter Section -->
  <section class="action-bar">
    <button class="add-rec-btn" onclick="openAddModal()">
      <span>➕ 새 정비 · 지출 내역 등록</span>
    </button>
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="정비 내용, 부품, 정비업체 검색..." oninput="onSearchChange()">
      <select id="sortSelect" class="sort-select" onchange="onSortChange()">
        <option value="date-desc">최신순</option>
        <option value="date-asc">오래된순</option>
        <option value="cost-desc">금액높은순</option>
        <option value="cost-asc">금액낮은순</option>
        <option value="km-desc">주행거리순</option>
      </select>
    </div>
    <div class="cat-filter-row" id="catFilterRow">
      <!-- Category chips injected dynamically -->
    </div>
  </section>

  <!-- Record List -->
  <main>
    <div class="record-count-bar">
      <span id="filteredCount">총 0건의 기록</span>
      <span id="filteredCostTotal">지출 합계: 0원</span>
    </div>
    <div class="record-list" id="recordList">
      <!-- Records injected dynamically -->
    </div>
  </main>

  <!-- Add/Edit Record Modal -->
  <div class="modal-overlay" id="recordModal" onclick="closeModalOnOverlay(event, 'recordModal')">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="recordModalTitle">새 정비·지출 등록</h2>
        <button class="modal-close" onclick="closeModal('recordModal')">&times;</button>
      </div>
      <form id="recordForm" onsubmit="handleRecordSubmit(event)">
        <input type="hidden" id="editRecordId">
        <div class="form-group">
          <label class="form-label">차종 선택 *</label>
          <select id="modalCarId" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">일자 *</label>
          <input type="date" id="modalDate" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">분류 *</label>
          <select id="modalCategory" class="form-control" required>
            <option value="엔진/오일">🛢️ 엔진/오일</option>
            <option value="정비/수리">🔧 정비/수리</option>
            <option value="타이어">🛞 타이어</option>
            <option value="전기/배터리">⚡ 전기/배터리</option>
            <option value="필터/소모품">💨 필터/소모품</option>
            <option value="보험/세금">🛡️ 보험/세금</option>
            <option value="주유">⛽ 주유</option>
            <option value="점검/정비">🔍 점검/검사</option>
            <option value="기타">📝 기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">수리 및 정비 내용 *</label>
          <input type="text" id="modalDesc" class="form-control" placeholder="예: 엔진오일 및 오일필터 교환" required>
          <div class="quick-tags">
            <span class="quick-tag-chip" onclick="setDescTag('엔진오일 교환', '엔진/오일')">엔진오일 교환</span>
            <span class="quick-tag-chip" onclick="setDescTag('에어컨필터 교체', '필터/소모품')">에어컨필터</span>
            <span class="quick-tag-chip" onclick="setDescTag('타이어 교체', '타이어')">타이어 교체</span>
            <span class="quick-tag-chip" onclick="setDescTag('배터리 교체', '전기/배터리')">배터리 교체</span>

          if (signalText) {
            window.pickle.widget.signal(signalText);
          }
        } catch (e) {
          console.error("Save error:", e);
        }
      }
    }

    if (window.pickle && window.pickle.widget) {
      window.pickle.widget.onstate = (newState) => {
        if (newState) {
          state = newState;
          render();
        }
      };

      window.pickle.widget.oncommand = (cmd) => {
        const parts = cmd.trim().split(/\s+/);
        const action = parts[0];
        if (action === "select") {
          const target = parts[1];
          if (target === "all" || state.vehicles.some(v => v.id === target)) {
            currentCarFilter = target;
            render();
            return true;
          }
          throw new Error("차량을 찾을 수 없습니다: " + target);
        } else if (action === "filter") {
          const cat = parts[1];
          currentCatFilter = cat || "all";
          render();
          return true;
        } else if (action === "add") {
          const carId = parts[1];
          const date = parts[2];
          const desc = parts[3];
          const cost = Number(parts[4]) || 0;
          const km = Number(parts[5]) || null;
          const shop = parts.slice(6).join(" ") || "";
          
          let cat = "정비/수리";
          if (desc.includes("오일")) cat = "엔진/오일";
          else if (desc.includes("타이어")) cat = "타이어";
          else if (desc.includes("배터리")) cat = "전기/배터리";
          else if (desc.includes("보험")) cat = "보험/세금";

          const newRec = {
            id: "rec_" + Date.now(),
            carId,
            date,
            description: desc,
            cost,
            km,
            shop,
            category: cat
          };

          const nextRecords = [newRec, ...state.records];
          const nextVehicles = state.vehicles.map(v => {
            if (v.id === carId && km && (!v.currentKm || km > v.currentKm)) {
              return { ...v, currentKm: km };
            }
            return v;
          });

          commit({ ...state, records: nextRecords, vehicles: nextVehicles }, `${carId} 차량에 ${desc} (${formatWon(cost)}) 정비 내역을 추가했습니다.`);
          return true;
        }
        return false;
      };
    }

      renderNav();
      renderDashboard();
      renderCatFilters();
      renderRecords();
    }

        const count = state.records.filter(r => r.carId === v.id).length;
        const icon = v.id === "carnival" ? "🚙" : (v.id === "lotze" ? "🚘" : "🚗");
        html += '<button class="nav-pill ' + (currentCarFilter === v.id ? 'active' : '') + '" onclick="setCarFilter(\'' + v.id + '\')">' + icon + ' ' + (v.plate || v.name) + ' (' + count + ')</button>';

          + '<div class="stat-box"><div class="stat-box-num" style="font-size:13px;">' + formatWon(totalCost) + '</div><div class="stat-box-lbl">총 누적비용</div></div>'

        return;

      const car = state.vehicles.find(v => v.id === currentCarFilter);

        const interval = car.oilIntervalKm || 10000;
        const nextOilKm = latestOil.km + interval;

        if (diffKm <= 0) {
          oilStatusHtml = '<span class="badge-alert">교환 시기 도래!</span><div class="health-desc">' + formatKm(Math.abs(diffKm)) + ' 초과 (권장: ' + formatKm(nextOilKm) + ')</div>';

    function renderCatFilters() {
      const container = document.getElementById("catFilterRow");
      let html = "";

    function renderRecords() {
      const list = document.getElementById("recordList");
      let filtered = [...state.records];

      if (currentCarFilter !== "all") {
        filtered = filtered.filter(r => r.carId === currentCarFilter);
      }

      if (currentCatFilter !== "all") {
        filtered = filtered.filter(r => r.category === currentCatFilter);
      }

      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        filtered = filtered.filter(r => 
          (r.description && r.description.toLowerCase().includes(q)) ||
          (r.shop && r.shop.toLowerCase().includes(q)) ||
          (r.date && r.date.includes(q))
        );
      }

      filtered.sort((a, b) => {
        if (currentSort === "date-desc") return (b.date || "").localeCompare(a.date || "");
        if (currentSort === "date-asc") return (a.date || "").localeCompare(b.date || "");
        if (currentSort === "cost-desc") return (b.cost || 0) - (a.cost || 0);
        if (currentSort === "cost-asc") return (a.cost || 0) - (b.cost || 0);
        if (currentSort === "km-desc") return (b.km || 0) - (a.km || 0);
        return 0;
      });

      const filteredCost = filtered.reduce((acc, r) => acc + (r.cost || 0), 0);
      document.getElementById("filteredCount").textContent = "총 " + filtered.length + "건의 기록";
      document.getElementById("filteredCostTotal").textContent = "지출 합계: " + formatWon(filteredCost);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><div style="font-size:32px; margin-bottom:8px;">🔍</div><div>해당 조건의 정비·지출 기록이 없습니다.</div></div>';
        return;
      }

      let html = "";
      filtered.forEach(r => {
        const car = state.vehicles.find(v => v.id === r.carId);
        const carTag = car ? (car.plate || car.name) : r.carId;
        
        let catClass = "cat-other";
        if (r.category === "엔진/오일") catClass = "cat-oil";
        else if (r.category === "타이어") catClass = "cat-tire";
        else if (r.category === "전기/배터리") catClass = "cat-electric";
        else if (r.category === "정비/수리") catClass = "cat-repair";
        else if (r.category === "필터/소모품") catClass = "cat-filter";
        else if (r.category === "보험/세금") catClass = "cat-insurance";
        else if (r.category === "주유") catClass = "cat-fuel";
        else if (r.category === "점검/정비") catClass = "cat-check";

        html += '<article class="record-item">'
          + '<div class="rec-top">'
          + '<div class="rec-date-car">'
          + '<span>📅 ' + (r.date || "날짜 미기록") + '</span>'
          + (currentCarFilter === 'all' ? '<span class="rec-car-tag">' + carTag + '</span>' : '')
          + '</div>'
          + '<span class="rec-cat-tag ' + catClass + '">' + r.category + '</span>'
          + '</div>'
          + '<div class="rec-mid">'
          + '<span class="rec-desc">' + (r.description || "상세 내역 없음") + '</span>'
          + '<span class="rec-cost">' + formatWon(r.cost) + '</span>'
          + '</div>'
          + '<div class="rec-bot">'
          + '<div class="rec-km-shop">'
          + (r.km ? '<span>📍 ' + formatKm(r.km) + '</span>' : '')
          + (r.shop ? '<span>🏢 ' + r.shop + '</span>' : '')
          + '</div>'
          + '<div class="rec-actions">'
          + '<button class="btn-text" onclick="openEditModal(\'' + r.id + '\')">수정</button>'
          + '<button class="btn-text btn-text-del" onclick="deleteRecord(\'' + r.id + '\')">삭제</button>'
          + '</div>'
          + '</div>'
          + '</article>';
      });

      list.innerHTML = html;
    }

      const category = document.getElementById("modalCategory").value;
      const description = document.getElementById("modalDesc").value.trim();
      const cost = Number(document.getElementById("modalCost").value) || 0;
      const kmVal = document.getElementById("modalKm").value;
      const km = kmVal ? Number(kmVal) : null;
      const shop = document.getElementById("modalShop").value.trim();

      let nextRecords = [...state.records];
      let signalMsg = "";

      if (editId) {
        nextRecords = nextRecords.map(r => r.id === editId ? { ...r, carId, date, category, description, cost, km, shop } : r);
        signalMsg = carId + " 차량의 " + description + " 내역을 수정했습니다.";
      } else {
        const newRec = {
          id: "rec_" + Date.now(),
          carId,
          date,
          category,
          description,
          cost,
          km,
          shop
        };
        nextRecords = [newRec, ...nextRecords];
        signalMsg = carId + " 차량에 " + description + " (" + formatWon(cost) + ") 정비를 새로 등록했습니다.";

        if (v.id === carId && km && (!v.currentKm || km > v.currentKm)) {
          return { ...v, currentKm: km };
        }
        return v;
      });

      commit({ ...state, records: nextRecords, vehicles: nextVehicles }, signalMsg);
      closeModal("recordModal");
    }

    function deleteRecord(recordId) {
      const r = state.records.find(item => item.id === recordId);
      if (!r) return;
      if (!confirm("'" + r.description + "' 내역을 정말 삭제하시겠습니까?")) return;

      const nextRecords = state.records.filter(item => item.id !== recordId);
      commit({ ...state, records: nextRecords }, "'" + r.description + "' 정비 내역을 삭제했습니다.");
    }

    function exportCSV() {
      let csvContent = "\uFEFF차종,수리일자,분류,수리내용,비용,주행거리,정비업체\n";
      state.records.forEach(r => {
        const car = state.vehicles.find(v => v.id === r.carId);
        const carName = car ? car.name : r.carId;
        const row = [
          '"' + carName + '"',
          '"' + (r.date || '') + '"',
          '"' + (r.category || '') + '"',
          '"' + (r.description || '').replace(/"/g, '""') + '"',
          r.cost || 0,
          r.km || '',
          '"' + (r.shop || '').replace(/"/g, '""') + '"'
        ];
        csvContent += row.join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "차계부_통합데이터_" + new Date().toISOString().slice(0,10) + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "차계부_전체백업_" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    render();
  </script>
